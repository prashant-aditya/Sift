repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff
        name: ruff check (backend)
        args: [--config, backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        name: ruff format --check (backend)
        args: [--check, --config, backend/pyproject.toml]
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: mypy (backend/app)
        args: [--config-file, backend/mypy.ini, backend/app]
        additional_dependencies:
          - pydantic==2.11.7
          - pydantic-settings==2.11.0
          - sqlalchemy==2.0.43
          - types-redis
          - types-cachetools

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast)
        entry: bash -lc 'cd backend && pytest -q -m "not slow and not integration"'
        language: system
        pass_filenames: false

