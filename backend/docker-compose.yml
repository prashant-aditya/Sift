services:
  redis:
    image: redis:7-alpine
    container_name: sift-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sift-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - chroma_data:/app/chroma_data
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sift-worker
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - chroma_data:/app/chroma_data
    depends_on:
      - redis
    command:
      [
        "celery",
        "-A",
        "workers.celery_app.celery_app",
        "worker",
        "-Q",
        "search,ingestion",
        "--loglevel=info",
      ]
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
