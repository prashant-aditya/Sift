services:
  backend:
    container_name: sift-backend-dev
    volumes:
      - .:/app
      - chroma_data:/app/chroma_data
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    restart: "no"
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_data
