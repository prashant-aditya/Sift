[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = False
no_implicit_optional = True
show_error_codes = True
disable_error_code = import-untyped,unused-ignore,union-attr,arg-type,assignment

# Keep CI stable: this repo uses many third-party libs without stubs.
ignore_missing_imports = True
follow_imports = skip

# Scope mypy to application code (not tests).
files = app
exclude = ^tests/

